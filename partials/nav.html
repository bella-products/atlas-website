<header data-nav-root data-menu-open="false" class="group/header fixed inset-x-0 top-0 z-50 pt-3 sm:pt-4 bg-white/75 backdrop-blur-md">
  <div class="mx-auto max-w-7xl px-6 sm:px-8 relative">
    <div class="flex h-16 items-center justify-between">
      <a href="/" aria-label="Atlas home" class="inline-flex items-center">
        <img src="/assets/img/atlas-logo.png" alt="Atlas" class="h-7 sm:h-8 w-auto" />
      </a>

      <!-- Inline link on sm+, hamburger on mobile -->
      <nav class="hidden sm:flex items-center gap-7 text-sm text-mute">
        <a href="/contact" class="transition-colors hover:text-ink">Contact</a>
      </nav>

      <button data-nav-toggle type="button" aria-label="Open menu" aria-expanded="false" class="sm:hidden inline-flex size-10 -mr-2 items-center justify-center rounded-full text-ink transition-colors hover:bg-surface-muted">
        <svg data-icon-open viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" class="size-5" aria-hidden="true"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
        <svg data-icon-close viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" class="size-5 hidden" aria-hidden="true"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>

    <!-- Mobile drawer -->
    <div data-nav-drawer class="sm:hidden absolute inset-x-2 top-full mt-1 rounded-2xl border border-line bg-white shadow-[0_20px_40px_-12px_rgba(0,0,0,0.15)] opacity-0 invisible transition-opacity duration-200 group-data-[menu-open=true]/header:opacity-100 group-data-[menu-open=true]/header:visible">
      <div class="flex flex-col px-3 py-3">
        <a href="/contact" class="rounded-xl px-3 py-3 text-base text-ink transition-colors hover:bg-surface-muted">Contact</a>
      </div>
    </div>
  </div>
</header>
