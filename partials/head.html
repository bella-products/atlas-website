<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>{{title}}</title>
<meta name="description" content="{{description}}" />
<link rel="canonical" href="{{canonical}}" />

<!-- Open Graph / Twitter -->
<meta property="og:title" content="{{title}}" />
<meta property="og:description" content="{{description}}" />
<meta property="og:type" content="website" />
<meta property="og:site_name" content="Atlas" />
<meta property="og:url" content="{{canonical}}" />
<meta property="og:image" content="{{siteUrl}}{{ogImage}}" />
<meta name="twitter:card" content="summary_large_image" />
<meta name="twitter:title" content="{{title}}" />
<meta name="twitter:description" content="{{description}}" />
<meta name="twitter:image" content="{{siteUrl}}{{ogImage}}" />

<link rel="icon" type="image/png" href="/assets/img/atlas-icon.png" />
<link rel="apple-touch-icon" href="/assets/img/atlas-icon.png" />

<!-- Fonts: Instrument Serif (display) + Geist (body) -->
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link
  rel="stylesheet"
  href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Geist:wght@300;400;500;600;700&family=Instrument+Serif:ital@0;1&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
/>

<link rel="stylesheet" href="/assets/css/styles.css" />

<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "Organization",
  "name": "Atlas",
  "url": "https://atlasbeauty.au",
  "logo": "https://atlasbeauty.au/assets/img/atlas-logo.png",
  "sameAs": [
    "https://www.instagram.com/join_atlas/",
    "https://www.tiktok.com/@join_atlas"
  ]
}
</script>
