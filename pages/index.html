<!-- meta title:  | description: Atlas is a community for honest beauty reviews. React, save and collect product and brand recommendations from a community you can trust. | path: / | active: home -->
{{> layout-start}}

<section class="bg-background flex flex-1 items-center pt-40 pb-10 sm:pt-24 sm:pb-8">
  <div class="mx-auto w-full max-w-7xl px-6 sm:px-8">
    <div class="grid items-center gap-10 sm:gap-10 lg:grid-cols-[0.9fr_1.15fr] lg:gap-0">

      <!-- Animated phone-mock of the Atlas search screen -->
      <div data-reveal class="order-2 lg:order-1 flex justify-center lg:justify-start lg:pl-12 xl:pl-20">
        {{> phone-mock}}
      </div>

      <!-- Copy + store buttons, wrapped in a content pill (white card on grey section bg - mirrors the product tile pattern from atlas-app). -->
      <div class="order-1 lg:order-2 max-w-xl lg:max-w-[560px] mx-auto lg:mx-0 lg:-ml-1 relative lg:mt-12">
        <div data-reveal class="rounded-3xl border border-line bg-white px-8 pt-12 pb-7 sm:px-9 sm:pt-16 sm:pb-7 lg:pl-12 text-center lg:text-left shadow-[0_4px_16px_-2px_rgba(0,0,0,0.06)]">
          <h1 class="font-euclid text-[clamp(1.75rem,5vw,2.75rem)] leading-[1.1] tracking-[0.005em] text-ink font-bold">
            <span class="lg:block">find beauty products</span>
            <span class="lg:block">worth raving about</span>
          </h1>

          <p style="--reveal-delay: 0.2s" class="mt-4 text-[16px] sm:text-[17px] leading-snug text-mute">
            your guide to beauty • join now
          </p>

          <!-- Store download buttons: App Store listing is live; Play Store routes to
               the /playstore waitlist. Markup lives in partials/store-badges.html. -->
          <div style="--reveal-delay: 0.3s" class="mt-8 flex flex-col sm:flex-row items-center lg:items-start justify-center lg:justify-start gap-3">
            {{> store-badges}}
          </div>
        </div>

        <!-- Atlas stickers around the pill (outside the card, positioned relative to outer wrapper). -->
        <div data-reveal style="--reveal-delay: 0.4s" class="absolute top-[-24px] left-[66%] w-[64px] lg:top-[-32px] lg:left-auto lg:right-[44px] lg:w-[76px]">
          <img src="/assets/img/sticker-duck.png" alt="" draggable="false" class="block w-full h-auto" style="transform: rotate(6deg);" />
        </div>
        <div data-reveal style="--reveal-delay: 0.5s" class="absolute top-[8px] right-[4px] w-[40px] lg:top-[-8px] lg:right-[-22px] lg:w-[60px]">
          <img src="/assets/img/sticker-star.png" alt="" draggable="false" class="block w-full h-auto" style="transform: rotate(-10deg);" />
        </div>
      </div>

    </div>
  </div>
</section>

{{> layout-end}}
