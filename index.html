</head>
<body class="min-h-screen flex flex-col bg-background text-ink antialiased overflow-x-clip">
<header data-nav-root data-menu-open="false" class="group/header fixed inset-x-0 top-0 z-50 pt-3 sm:pt-4 bg-white/75 backdrop-blur-md">
  <div class="mx-auto max-w-7xl px-6 sm:px-8 relative">
    <div class="flex h-16 items-center justify-between">
      <a href="/" aria-label="Atlas home" class="inline-flex items-center">
        <img src="/assets/img/atlas-logo.png" alt="Atlas" class="h-7 sm:h-8 w-auto" />
      </a>

      <!-- Inline link on sm+, hamburger on mobile -->
      <nav class="hidden sm:flex items-center gap-7 text-sm text-mute">
        <a href="/contact" class="transition-colors hover:text-ink">Contact</a>
      </nav>

      <button data-nav-toggle type="button" aria-label="Open menu" aria-expanded="false" class="sm:hidden inline-flex size-10 -mr-2 items-center justify-center rounded-full text-ink transition-colors hover:bg-surface-muted">
        <svg data-icon-open viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" class="size-5" aria-hidden="true"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
        <svg data-icon-close viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" class="size-5 hidden" aria-hidden="true"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>

    <!-- Mobile drawer -->
    <div data-nav-drawer class="sm:hidden absolute inset-x-2 top-full mt-1 rounded-2xl border border-line bg-white shadow-[0_20px_40px_-12px_rgba(0,0,0,0.15)] opacity-0 invisible transition-opacity duration-200 group-data-[menu-open=true]/header:opacity-100 group-data-[menu-open=true]/header:visible">
      <div class="flex flex-col px-3 py-3">
        <a href="/contact" class="rounded-xl px-3 py-3 text-base text-ink transition-colors hover:bg-surface-muted">Contact</a>
      </div>
    </div>
  </div>
</header>

<main class="flex-1 flex flex-col">


<section class="bg-background flex flex-1 items-center pt-40 pb-10 sm:pt-24 sm:pb-8">
  <div class="mx-auto w-full max-w-7xl px-6 sm:px-8">
    <div class="grid items-center gap-10 sm:gap-10 lg:grid-cols-[0.9fr_1.15fr] lg:gap-0">

      <!-- Animated phone-mock of the Atlas search screen -->
      <div data-reveal class="order-2 lg:order-1 flex justify-center lg:justify-start lg:pl-12 xl:pl-20">
        <!-- Atlas phone hero. Real app-screen export as base, animated overlays
     using FloatingDiscovery's rotation angles + two-wave entrance. Sizes
     and x/y values are bumped from the app's exact figures so items
     "spill" past the phone bezel for a livelier hero. -->
<div class="relative mx-auto w-full max-w-[320px] sm:max-w-[380px] lg:max-w-[440px]">

  <!-- Base screenshot (phone bezel + chrome) -->
  <img
    src="/assets/img/atlas-demo-base.png"
    alt="Atlas app - searching product and brand reviews"
    class="block w-full h-auto select-none"
    loading="eager"
    fetchpriority="high"
    draggable="false"
  />

  <!-- Overlay aligned to the phone's discovery area. overflow:visible (default)
       so wider pills and edge products can spill past the bezel. -->
  <div class="absolute left-[22%] right-[22%] top-[26%] bottom-[14%]">

    <!-- WAVE 1 - Rhode trio -->
    <!-- rhode peptide lip balm - back inside, upper-left -->
    <div class="absolute float-item float-wave-1 w-[26%]" style="left: 16%; top: 4%; --rot: -6deg; --bob-dur: 3.6s;">
      <div class="bg-white border border-line rounded-xl p-1 overflow-hidden aspect-square shadow-[0_4px_12px_-3px_rgba(0,0,0,0.08)] flex items-center justify-center">
        <img src="/assets/img/rhode-lipbalm.png" alt="" draggable="false" class="block max-w-full max-h-full object-contain object-center rounded-lg" />
      </div>
    </div>

    <!-- rhode blush - right of centre -->
    <div class="absolute float-item float-wave-1 w-[26%]" style="left: 58%; top: 52%; --rot: 6deg; --bob-dur: 4.8s;">
      <div class="bg-white border border-line rounded-xl p-1 overflow-hidden aspect-square shadow-[0_4px_12px_-3px_rgba(0,0,0,0.08)] flex items-center justify-center">
        <img src="/assets/img/rhode-blush.png" alt="" draggable="false" class="block max-w-full max-h-full object-contain object-center rounded-lg" />
      </div>
    </div>

    <!-- Rhode Talk pill - lower-right, pushed past the bezel -->
    <div class="absolute float-item float-wave-1" style="left: 52%; top: 76%; --rot: 3deg; --bob-dur: 4.5s;">
      <div class="inline-flex w-max items-center bg-white border border-line rounded-[22px] p-1 pr-4 sm:pr-5 shadow-[0_6px_20px_-4px_rgba(0,0,0,0.10)]">
        <img src="/assets/img/rhode-logo.jpg" alt="" draggable="false" class="size-8 sm:size-9 rounded-2xl object-cover shrink-0" />
        <div class="pl-2.5 flex flex-col leading-tight">
          <div class="flex items-baseline whitespace-nowrap">
            <span class="text-[11px] sm:text-[12px] text-ink font-light">Rhode Talk</span><span class="text-[11px] sm:text-[12px] text-mute font-light">, Australia</span>
          </div>
          <span class="text-[9px] sm:text-[10px] text-mute font-light mt-0.5 whitespace-nowrap">6,040 Users</span>
        </div>
      </div>
    </div>

    <!-- WAVE 2 - everything else -->
    <!-- clinique moisturiser - upper-right, inside -->
    <div class="absolute float-item float-wave-2 w-[24%]" style="left: 64%; top: 8%; --rot: 4deg; --bob-dur: 4.0s;">
      <div class="bg-white border border-line rounded-xl p-1 overflow-hidden aspect-square shadow-[0_4px_12px_-3px_rgba(0,0,0,0.08)] flex items-center justify-center">
        <img src="/assets/img/clinique-bottle.png" alt="" draggable="false" class="block max-w-full max-h-full object-contain object-center rounded-lg" />
      </div>
    </div>

    <!-- charlotte tilbury - spills past LEFT bezel -->
    <div class="absolute float-item float-wave-2 w-[26%]" style="left: -12%; top: 32%; --rot: -3deg; --bob-dur: 4.4s;">
      <div class="bg-white border border-line rounded-xl p-1 overflow-hidden aspect-square shadow-[0_4px_12px_-3px_rgba(0,0,0,0.08)] flex items-center justify-center">
        <img src="/assets/img/charlotte-tilbury.png" alt="" draggable="false" class="block max-w-full max-h-full object-contain object-center rounded-lg" />
      </div>
    </div>

    <!-- Mecca Talk pill - upper-middle, extends right past bezel naturally -->
    <div class="absolute float-item float-wave-2" style="left: 32%; top: 28%; --rot: -2deg; --bob-dur: 3.9s;">
      <div class="inline-flex w-max items-center bg-white border border-line rounded-[22px] p-1 pr-4 sm:pr-5 shadow-[0_6px_20px_-4px_rgba(0,0,0,0.10)]">
        <img src="/assets/img/mecca-logo.jpeg" alt="" draggable="false" class="size-8 sm:size-9 rounded-2xl object-cover shrink-0" />
        <div class="pl-2.5 flex flex-col leading-tight">
          <div class="flex items-baseline whitespace-nowrap">
            <span class="text-[11px] sm:text-[12px] text-ink font-light">Mecca Talk</span><span class="text-[11px] sm:text-[12px] text-mute font-light">, Australia</span>
          </div>
          <span class="text-[9px] sm:text-[10px] text-mute font-light mt-0.5 whitespace-nowrap">35,300 Users</span>
        </div>
      </div>
    </div>

    <!-- laura mercier - lower left, inside -->
    <div class="absolute float-item float-wave-2 w-[22%]" style="left: 8%; top: 64%; --rot: 2deg; --bob-dur: 5.2s;">
      <div class="bg-white border border-line rounded-xl p-1 overflow-hidden aspect-square shadow-[0_4px_12px_-3px_rgba(0,0,0,0.08)] flex items-center justify-center">
        <img src="/assets/img/laura-mercier.png" alt="" draggable="false" class="block max-w-full max-h-full object-contain object-center rounded-lg" />
      </div>
    </div>

  </div>
</div>

      </div>

      <!-- Copy + store buttons, wrapped in a content pill (white card on grey section bg - mirrors the product tile pattern from atlas-app). -->
      <div class="order-1 lg:order-2 max-w-xl lg:max-w-[560px] mx-auto lg:mx-0 lg:-ml-1 relative lg:mt-12">
        <div data-reveal class="rounded-3xl border border-line bg-white px-8 pt-12 pb-7 sm:px-9 sm:pt-16 sm:pb-7 lg:pl-12 text-center lg:text-left shadow-[0_4px_16px_-2px_rgba(0,0,0,0.06)]">
          <h1 class="font-euclid text-[clamp(1.75rem,5vw,2.75rem)] leading-[1.1] tracking-[0.005em] text-ink font-bold">
            <span class="lg:block">find beauty products</span>
            <span class="lg:block">worth raving about</span>
          </h1>

          <p style="--reveal-delay: 0.2s" class="mt-4 text-[16px] sm:text-[17px] leading-snug text-mute">
            your guide to beauty • join now

               the /playstore waitlist. Markup lives in partials/store-badges.html. -->
          <div style="--reveal-delay: 0.3s" class="mt-8 flex flex-col sm:flex-row items-center lg:items-start justify-center lg:justify-start gap-3">
            <!-- App Store: live listing (AU storefront). -->
<a href="https://apps.apple.com/au/app/atlas-beauty-product-reviews/id6775998598" target="_blank" rel="noopener noreferrer" aria-label="Download on the App Store" class="group inline-flex h-14 items-center gap-3 rounded-2xl border border-line bg-white px-5 text-ink transition-all duration-300 will-change-transform hover:-translate-y-[1px] hover:border-line-strong hover:shadow-[0_8px_24px_-12px_rgba(0,0,0,0.12)] focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ink/15 focus-visible:ring-offset-2 focus-visible:ring-offset-background">
  <svg viewBox="0 0 24 24" class="size-7" fill="currentColor" aria-hidden="true"><path d="M17.05 12.04c-.03-2.69 2.2-3.99 2.3-4.05-1.25-1.83-3.2-2.08-3.89-2.11-1.66-.17-3.24.97-4.08.97-.85 0-2.15-.95-3.54-.92-1.82.03-3.5 1.06-4.44 2.69-1.89 3.28-.48 8.13 1.36 10.79.9 1.31 1.97 2.77 3.37 2.72 1.36-.06 1.87-.88 3.51-.88 1.64 0 2.1.88 3.53.85 1.46-.03 2.38-1.32 3.27-2.64 1.03-1.51 1.45-2.98 1.47-3.06-.03-.01-2.83-1.08-2.86-4.36zM14.36 4.27c.74-.9 1.24-2.15 1.1-3.39-1.07.04-2.36.71-3.13 1.6-.69.79-1.29 2.06-1.13 3.27 1.19.09 2.42-.6 3.16-1.48z"/></svg>
  <span class="flex flex-col items-start leading-none">
    <span class="text-[10px] tracking-wide text-mute">Download on the</span>
    <span class="mt-0.5 text-[18px] font-medium tracking-tight">App Store</span>
  </span>
</a>

<!-- Play Store: routes to /playstore waitlist. -->
<a href="/playstore" aria-label="Join the Google Play waitlist" class="group inline-flex h-14 items-center gap-3 rounded-2xl border border-line bg-white px-5 text-ink transition-all duration-300 will-change-transform hover:-translate-y-[1px] hover:border-line-strong hover:shadow-[0_8px_24px_-12px_rgba(0,0,0,0.12)] focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ink/15 focus-visible:ring-offset-2 focus-visible:ring-offset-background">
  <svg viewBox="0 0 24 24" class="size-7" aria-hidden="true">
    <defs>
      <linearGradient id="play-blue" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#00C3FF"/><stop offset="100%" stop-color="#0064D5"/></linearGradient>
      <linearGradient id="play-yellow" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#FFD800"/><stop offset="100%" stop-color="#FF9900"/></linearGradient>
      <linearGradient id="play-red" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#FF4B4B"/><stop offset="100%" stop-color="#D6262C"/></linearGradient>
      <linearGradient id="play-green" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#06EF7B"/><stop offset="100%" stop-color="#00B14F"/></linearGradient>

    <path d="M3.5 2.5C3.2 2.7 3 3.1 3 3.6v16.8c0 .5.2.9.5 1.1l9.4-9.5L3.5 2.5z" fill="url(#play-blue)"/>

    <path d="M16.7 15.6 5.3 22.8c-.5.3-1 .3-1.4.1l9.8-9.9 3 2.6z" fill="url(#play-red)"/>
    <path d="m16.7 8.4 4 2.4c.7.4.7 1.5 0 1.9l-4 2.4-3-2.6 3-2.1z" fill="url(#play-yellow)"/>
  </svg>
  <span class="flex flex-col items-start leading-none">
    <span class="text-[10px] tracking-wide text-mute">Join waitlist</span>
    <span class="mt-0.5 text-[18px] font-medium tracking-tight">Google Play</span>
  </span>
</a>

          </div>
        </div>

        <!-- Atlas stickers around the pill (outside the card, positioned relative to outer wrapper). -->
        <div data-reveal style="--reveal-delay: 0.4s" class="absolute top-[-24px] left-[66%] w-[64px] lg:top-[-32px] lg:left-auto lg:right-[44px] lg:w-[76px]">
          <img src="/assets/img/sticker-duck.png" alt="" draggable="false" class="block w-full h-auto" style="transform: rotate(6deg);" />
        </div>
        <div data-reveal style="--reveal-delay: 0.5s" class="absolute top-[8px] right-[4px] w-[40px] lg:top-[-8px] lg:right-[-22px] lg:w-[60px]">
          <img src="/assets/img/sticker-star.png" alt="" draggable="false" class="block w-full h-auto" style="transform: rotate(-10deg);" />
        </div>
      </div>

    </div>
  </div>
</section>

      <!-- Copyright (inline-left on sm+; hidden on mobile - shown below the pills row instead) -->
      <p class="hidden sm:block text-xs text-mute leading-tight">© 2026 Atlas - Bella App Pty Ltd</p>

      <!-- Legal links pill (shorter labels + tighter padding on mobile) -->
      <nav class="inline-flex h-10 sm:h-11 items-center gap-3 sm:gap-5 rounded-full border border-line bg-white px-4 sm:px-5 text-xs sm:text-sm text-ink-soft">
        <a href="/privacy" class="transition-colors hover:text-ink"><span class="sm:hidden">Privacy</span><span class="hidden sm:inline">Privacy policy</span></a>
        <a href="/terms" class="transition-colors hover:text-ink"><span class="sm:hidden">Terms</span><span class="hidden sm:inline">Terms of use</span></a>
      </nav>

      <!-- Socials pill -->
      <div class="inline-flex h-10 sm:h-11 items-center gap-1 rounded-full border border-line bg-white px-2">
