<!doctype html>

  "@type": "Organization",
  "name": "Atlas",
  "url": "https://atlasbeauty.au",

</head>
<body class="min-h-screen flex flex-col bg-background text-ink antialiased overflow-x-clip">
<header data-nav-root data-menu-open="false" class="group/header fixed inset-x-0 top-0 z-50 pt-3 sm:pt-4 bg-white/75 backdrop-blur-md">
  <div class="mx-auto max-w-7xl px-6 sm:px-8 relative">
    <div class="flex h-16 items-center justify-between">
      <a href="/" aria-label="Atlas home" class="inline-flex items-center">
        <img src="/assets/img/atlas-logo.png" alt="Atlas" class="h-7 sm:h-8 w-auto" />
      </a>

      <!-- Inline link on sm+, hamburger on mobile -->
      <nav class="hidden sm:flex items-center gap-7 text-sm text-mute">
        <a href="/contact" class="transition-colors hover:text-ink">Contact</a>
      </nav>

      <button data-nav-toggle type="button" aria-label="Open menu" aria-expanded="false" class="sm:hidden inline-flex size-10 -mr-2 items-center justify-center rounded-full text-ink transition-colors hover:bg-surface-muted">
        <svg data-icon-open viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" class="size-5" aria-hidden="true"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
        <svg data-icon-close viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" class="size-5 hidden" aria-hidden="true"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>

    <!-- Mobile drawer -->
    <div data-nav-drawer class="sm:hidden absolute inset-x-2 top-full mt-1 rounded-2xl border border-line bg-white shadow-[0_20px_40px_-12px_rgba(0,0,0,0.15)] opacity-0 invisible transition-opacity duration-200 group-data-[menu-open=true]/header:opacity-100 group-data-[menu-open=true]/header:visible">
      <div class="flex flex-col px-3 py-3">
        <a href="/contact" class="rounded-xl px-3 py-3 text-base text-ink transition-colors hover:bg-surface-muted">Contact</a>
      </div>
    </div>
  </div>
</header>

<main class="flex-1 flex flex-col">


<section class="bg-background pt-28 sm:pt-32 pb-24">
  <div class="mx-auto max-w-3xl px-6 sm:px-8">
    <div data-reveal>
      <a href="/" class="inline-flex items-center gap-1.5 text-sm text-mute transition-colors hover:text-ink">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" class="size-3.5" aria-hidden="true"><polyline points="15 18 9 12 15 6"/></svg>
        Back home
      </a>
    </div>

    <div data-reveal class="relative mt-12 sm:mt-14">
      <!-- Atlas pill, overlapping the top edge of the contact card. Matches atlas-app's GroupPill: white bg, hairline border, soft outer shadow only - no inner shadow on the logo. -->
      <div class="absolute -top-6 sm:-top-7 left-6 sm:left-10 z-10 inline-flex w-max items-center bg-white border border-line rounded-[20px] p-1 pr-6 shadow-[0_6px_20px_-2px_rgba(0,0,0,0.10)]">
        <img src="/assets/img/atlas-mark.png" alt="" draggable="false" class="size-11 sm:size-12 rounded-[14px] object-cover shrink-0" />
        <div class="pl-3 flex flex-col leading-tight">
          <span class="text-[15px] sm:text-[16px] text-ink font-medium">Atlas</span>
          <span class="text-[13px] sm:text-[14px] text-mute mt-0.5">Sydney, AU</span>
        </div>
      </div>

      <!-- Contact card (white background with soft drop shadow, mirrors atlas-app post cards. Extra top padding to clear the overlapping pill.) -->
      <div class="rounded-3xl border border-line bg-white px-8 pt-16 pb-12 sm:px-14 sm:pt-20 sm:pb-16 text-center shadow-[0_8px_32px_-8px_rgba(0,0,0,0.08)]">
        <h1 class="font-euclid text-[clamp(1.75rem,5vw,2.75rem)] leading-[1.1] tracking-[0.005em] text-ink font-bold">we'd love to hear from you</h1>

        <p class="mt-8 text-[16px] sm:text-[18px] text-ink leading-relaxed">
          for questions or feedback,<br />
          reach out to <a href="mailto:hello@atlasbeauty.au" class="hover:underline" style="color: #5BA3D9;">hello@atlasbeauty.au</a>
        </p>

        <p class="mt-10 text-[16px] sm:text-[18px] text-ink leading-relaxed">
          for press and partnership inquiries,<br />
          reach out to <a href="mailto:pr@atlasbeauty.au" class="hover:underline" style="color: #5BA3D9;">pr@atlasbeauty.au</a>
        </p>

        <p class="mt-12 text-[15px] sm:text-[16px] text-ink">follow us on socials:</p>
        <div class="mt-4 flex items-center justify-center gap-5">
          <a href="https://www.instagram.com/join_atlas/" target="_blank" rel="noopener noreferrer" aria-label="Atlas on Instagram" class="text-ink transition-colors hover:text-mute">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" class="size-6" aria-hidden="true"><rect width="18" height="18" x="3" y="3" rx="5"/><path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"/><line x1="17.5" x2="17.51" y1="6.5" y2="6.5"/></svg>
          </a>
          <a href="https://www.tiktok.com/@join_atlas" target="_blank" rel="noopener noreferrer" aria-label="Atlas on TikTok" class="text-ink transition-colors hover:text-mute">
            <svg viewBox="0 0 24 24" fill="currentColor" class="size-6" aria-hidden="true"><path d="M19.59 6.69a4.83 4.83 0 0 1-3.77-4.25V2h-3.45v13.67a2.89 2.89 0 0 1-5.2 1.74 2.89 2.89 0 0 1 2.31-4.64 2.93 2.93 0 0 1 .88.13V9.4a6.84 6.84 0 0 0-1-.05A6.33 6.33 0 0 0 5.8 20.1a6.34 6.34 0 0 0 10.86-4.43V8.79a8.16 8.16 0 0 0 4.77 1.52V6.86a4.85 4.85 0 0 1-1.84-.17z"/></svg>
          </a>
        </div>
      </div>
    </div>
  </div>
</section>

</main>
<footer class="mt-auto px-4 pb-3 sm:px-6 sm:pb-6">
  <div class="mx-auto max-w-7xl">
    <div class="flex flex-wrap items-center justify-between gap-2 sm:gap-3">

      <!-- Copyright (inline-left on sm+; hidden on mobile - shown below the pills row instead) -->
      <p class="hidden sm:block text-xs text-mute leading-tight">© 2026 Atlas - Bella App Pty Ltd</p>

      <!-- Legal links pill (shorter labels + tighter padding on mobile) -->
      <nav class="inline-flex h-10 sm:h-11 items-center gap-3 sm:gap-5 rounded-full border border-line bg-white px-4 sm:px-5 text-xs sm:text-sm text-ink-soft">
        <a href="/privacy" class="transition-colors hover:text-ink"><span class="sm:hidden">Privacy</span><span class="hidden sm:inline">Privacy policy</span></a>
        <a href="/terms" class="transition-colors hover:text-ink"><span class="sm:hidden">Terms</span><span class="hidden sm:inline">Terms of use</span></a>
      </nav>

      <!-- Socials pill -->
      <div class="inline-flex h-10 sm:h-11 items-center gap-1 rounded-full border border-line bg-white px-2">
        <a href="https://www.tiktok.com/@join_atlas" target="_blank" rel="noopener noreferrer" aria-label="Atlas on TikTok" class="inline-flex size-8 sm:size-9 items-center justify-center rounded-full text-ink-soft transition-colors hover:bg-surface-muted hover:text-ink">
          <svg viewBox="0 0 24 24" fill="currentColor" class="size-3.5 sm:size-4" aria-hidden="true"><path d="M19.59 6.69a4.83 4.83 0 0 1-3.77-4.25V2h-3.45v13.67a2.89 2.89 0 0 1-5.2 1.74 2.89 2.89 0 0 1 2.31-4.64 2.93 2.93 0 0 1 .88.13V9.4a6.84 6.84 0 0 0-1-.05A6.33 6.33 0 0 0 5.8 20.1a6.34 6.34 0 0 0 10.86-4.43V8.79a8.16 8.16 0 0 0 4.77 1.52V6.86a4.85 4.85 0 0 1-1.84-.17z"/></svg>
        </a>
        <a href="https://www.instagram.com/join_atlas/" target="_blank" rel="noopener noreferrer" aria-label="Atlas on Instagram" class="inline-flex size-8 sm:size-9 items-center justify-center rounded-full text-ink-soft transition-colors hover:bg-surface-muted hover:text-ink">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" class="size-3.5 sm:size-4" aria-hidden="true"><rect width="18" height="18" x="3" y="3" rx="5"/><path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"/><line x1="17.5" x2="17.51" y1="6.5" y2="6.5"/></svg>
        </a>
      </div>
    </div>

  </div>
</footer>

<script type="module" src="/assets/js/nav.js"></script>
